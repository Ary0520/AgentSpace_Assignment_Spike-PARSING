<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentSpace - Extraction Spike</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: {
                            850: '#1f2937',
                            900: '#111827',
                            950: '#030712'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .drag-active { border-color: #3b82f6 !important; background-color: rgba(59, 130, 246, 0.05) !important; }
    </style>
</head>
<body class="bg-gray-950 text-gray-200 min-h-screen">
    <div class="max-w-6xl mx-auto px-6 py-12">
        <header class="mb-12 border-b border-gray-800 pb-6 flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-semibold text-white tracking-tight">AgentSpace Extraction Spike</h1>
                <p class="text-gray-400 text-sm mt-1">Customs Document Intelligence (OCR + Deterministic Validation)</p>
            </div>
            <div class="text-xs font-mono bg-blue-900/30 text-blue-400 px-3 py-1.5 rounded border border-blue-800/50">
                v1.0.0-spike
            </div>
        </header>

        <!-- Upload View -->
        <section id="upload-view" class="mb-8">
            <div id="dropzone" class="border-2 border-dashed border-gray-700 rounded-lg p-16 text-center transition-all duration-200 hover:border-gray-500 bg-gray-900/50">
                <svg class="mx-auto h-12 w-12 text-gray-500 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                </svg>
                <h3 class="text-lg font-medium text-gray-200">Upload Bill of Entry</h3>
                <p class="text-sm text-gray-500 mt-1 mb-6">Drag and drop a PDF file here, or click to browse</p>
                <input type="file" id="file-input" class="hidden" accept="application/pdf">
                <button onclick="document.getElementById('file-input').click()" class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium py-2 px-5 rounded transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-gray-900">
                    Browse files
                </button>
            </div>
        </section>

        <!-- Processing View -->
        <section id="processing-view" class="hidden mb-8">
            <div class="bg-gray-900 rounded-lg border border-gray-800 p-8">
                <div class="flex items-center space-x-4 mb-6">
                    <div class="w-8 h-8 rounded-full bg-blue-900/50 flex items-center justify-center border border-blue-800">
                        <svg class="w-4 h-4 text-blue-400 animate-spin" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </div>
                    <div>
                        <h3 class="text-lg font-medium text-gray-200">Processing Document</h3>
                        <p id="filename-display" class="text-sm text-gray-400 font-mono mt-1"></p>
                    </div>
                </div>

                <div class="space-y-4 font-mono text-sm" id="progress-steps">
                    <!-- Dynamic steps inserted via JS -->
                </div>
            </div>
        </section>

        <!-- Results View -->
        <section id="results-view" class="hidden flex flex-col space-y-8">
            <!-- Will be populated by JS -->
        </section>
        
    </div>

    <script src="app.js"></script>
</body>
</html>
